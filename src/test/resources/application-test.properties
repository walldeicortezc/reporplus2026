# Banco em memoria exclusivo dos testes. Ele nasce e e descartado a cada execucao.
spring.datasource.url=jdbc:h2:mem:reporplus2026_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.show-sql=false
logging.level.liquibase=INFO
