databaseChangeLog:
  - changeSet:
      id: 003-01-create-fornecedor
      author: reporplus
      changes:
        - createTable:
            tableName: fornecedor
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fornecedor
                    nullable: false
              - column:
                  name: razao_social
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: cnpj
                  type: VARCHAR(14)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: fornecedor

  - changeSet:
      id: 003-02-constraints-fornecedor
      author: reporplus
      changes:
        - addUniqueConstraint:
            tableName: fornecedor
            columnNames: cnpj
            constraintName: uk_fornecedor_cnpj
        - sql:
            sql: >
              ALTER TABLE fornecedor ADD CONSTRAINT ck_fornecedor_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: ALTER TABLE fornecedor DROP CONSTRAINT ck_fornecedor_status
        - dropUniqueConstraint:
            tableName: fornecedor
            constraintName: uk_fornecedor_cnpj

  - changeSet:
      id: 003-03-expand-estoque-minimo
      author: reporplus
      comment: Primeiro cria a coluna aceitando nulo para preservar linhas antigas.
      changes:
        - addColumn:
            tableName: peca
            columns:
              - column:
                  name: estoque_minimo
                  type: INTEGER
      rollback:
        - dropColumn:
            tableName: peca
            columnName: estoque_minimo

  - changeSet:
      id: 003-04-migrate-estoque-minimo
      author: reporplus
      comment: Preenche as pecas existentes antes de tornar a coluna obrigatoria.
      changes:
        - update:
            tableName: peca
            columns:
              - column:
                  name: estoque_minimo
                  valueNumeric: 0
            where: estoque_minimo IS NULL
      rollback: []

  - changeSet:
      id: 003-05-contract-estoque-minimo
      author: reporplus
      changes:
        - addNotNullConstraint:
            tableName: peca
            columnName: estoque_minimo
            columnDataType: INTEGER
        - sql:
            sql: >
              ALTER TABLE peca ADD CONSTRAINT ck_peca_estoque_minimo
              CHECK (estoque_minimo >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE peca DROP CONSTRAINT ck_peca_estoque_minimo
        - dropNotNullConstraint:
            tableName: peca
            columnName: estoque_minimo
            columnDataType: INTEGER

  - changeSet:
      id: 003-06-relacionamento-fornecedor
      author: reporplus
      comment: O fornecedor e opcional para manter compativeis as pecas antigas.
      changes:
        - addColumn:
            tableName: peca
            columns:
              - column:
                  name: fornecedor_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: peca
            baseColumnNames: fornecedor_id
            referencedTableName: fornecedor
            referencedColumnNames: id
            constraintName: fk_peca_fornecedor
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: peca
            constraintName: fk_peca_fornecedor
        - dropColumn:
            tableName: peca
            columnName: fornecedor_id
