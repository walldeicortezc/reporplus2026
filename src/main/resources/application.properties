spring.application.name=reporplus2026

# Usa o ambiente de desenvolvimento quando nenhum perfil for informado.
# Testes continuam ativando explicitamente o perfil "test".
spring.profiles.default=dev

# O Liquibase cria e evolui o esquema; o Hibernate apenas valida o mapeamento.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.config.import=optional:file:./.env[.properties]

# A API sempre devolve páginas controladas, mesmo quando o cliente informa size alto.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
